<input
  title="Upload file"
  #fileInput
  type="file"
  class="sr-only"
  tabindex="-1"
  [accept]="accept()"
  [disabled]="isDisabled"
  (change)="onFileSelected($event)"
/>

<div class="uploader-input flex flex-col gap-2">
  <div class="flex flex-wrap items-center gap-2">
    <p-button
      type="button"
      title="Choose file"
      [label]="chooseLabel()"
      [disabled]="isDisabled"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="openPicker()"
    />
    @if (previewUrl()) {
      <p-button
        type="button"
        title="Clear file"
        [label]="clearLabel()"
        [disabled]="isDisabled"
        [text]="true"
        severity="secondary"
        size="small"
        (onClick)="clear()"
      />
    }
  </div>
  @if (previewUrl()) {
    <div class="uploader-input__preview overflow-hidden rounded-md border border-slate-200 bg-slate-50">
      <img [src]="previewUrl()" alt="" title="File preview" class="h-20 w-20 object-cover" />
    </div>
  }
  @if (errorMessage()) {
    <small class="text-red-600">{{ errorMessage() | tr: i18n.locale() }}</small>
  }
</div>
