<div class="rounded-xl border border-slate-200/70 bg-white px-6 py-5 shadow-sm">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0 flex-1">
      <p class="text-sm font-medium text-slate-500">{{ stat().title }}</p>
      <p class="mt-1.5 text-4xl font-bold tracking-tight text-slate-900">
        {{ stat().value }}
      </p>
      <p class="mt-2 text-xs font-medium" [class]="changeColor">
        {{ stat().change }}&nbsp;<span class="font-normal text-slate-400">{{ stat().changeLabel }}</span>
      </p>
    </div>

    <span
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
      [class]="iconBgClass"
      aria-hidden="true"
    >
      @switch (stat().icon) {
        @case ('tasks') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke-linecap="round"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <path d="M9 12h6M9 16h4" stroke-linecap="round"/>
          </svg>
        }
        @case ('completed') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
        @case ('in_progress') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4l2.5 2.5" stroke-linecap="round"/>
          </svg>
        }
        @case ('overdue') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linejoin="round"/>
            <path d="M12 9v4M12 17h.01" stroke-linecap="round"/>
          </svg>
        }
      }
    </span>
  </div>
</div>
